spring:
  datasource:
    url: jdbc:mysql://localhost:3306/rankandfile
    username: ${db_user}
    password: ${db_pass}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/app-changelog.xml

congress.api.key: ${api_key}
congress.api.url: "https://api.congress.gov/v3/"